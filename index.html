<!DOCTYPE html>
<html>
<head>
    <title>Xylon's Glucose</title>
    <meta http-equiv="refresh" content="60">
    <style>
        body { background: black; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .profile-pic { width: 340px; height: 340px; border-radius: 25%; border: 3px solid #00ff00; object-fit: cover; }
        #glucose-val { font-size: 250px; font-weight: 900; line-height: 0.9; margin: 10px 0; }
        #trend-arrow { font-size: 50px; color: #008800; margin-bottom: 20px; }

        .ledger { margin: 20px auto; width: 95%; max-width: 700px; border-top: 2px solid #004400; }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 12px 5px;
            border-bottom: 1px solid #002200;
            font-size: 18px; /* Shrunk slightly to fit full date */
        }

        /* Column Width Logic */
        .row span:first-child { flex: 3; text-align: left; color: #008800; } /* Date Column */
        .row span:nth-child(2) { flex: 1.5; text-align: center; }            /* Trend Column */
        .row span:last-child { flex: 1; text-align: right; font-weight: bold; } /* BG Column */

        .header { color: #00ff00; font-weight: bold; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <img src="xylon.png" class="profile-pic" onerror="this.style.display='none'">

    <div id="glucose-val">--</div>
    <div id="trend-arrow">--</div>

    <div class="ledger">
        <div class="row header">
            <span>Timestamp</span>
            <span>Trend</span>
            <span>BG</span>
        </div>
        <div id="ledger-content"></div>
    </div>

    <script>
fetch('data.json?t=' + new Date().getTime())
    .then(r => r.json())
    .then(history => {
        // Since monitor.py saves a LIST, we take the first item
        if (history && history.length > 0) {
            const latest = history[0];

            // 1. Update the BIG numbers
            document.getElementById('glucose-val').innerText = latest.value;
            document.getElementById('trend-arrow').innerText = latest.trend;

            // 2. Populate the ledger rows
            document.getElementById('ledger-content').innerHTML = history.map(entry => `
                <div class="row">
                    <span>${entry.time}</span>   <span>${entry.trend}</span>  <span>${entry.value}</span>  </div>
            `).join('');
        }
    })
    .catch(err => {
        console.error("Error reading JSON:", err);
        document.getElementById('glucose-val').innerText = "WAIT";
    });
</script>
</body>
</html>
